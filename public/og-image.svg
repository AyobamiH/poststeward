<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PostSteward — Social publishing infrastructure for AI agents</title>
  <desc id="desc">PostSteward social preview with the publishing-route mark and a compact intent to evidence control-plane diagram.</desc>
  <defs>
