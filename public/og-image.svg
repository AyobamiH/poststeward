    <path d="m25.2 31.3 3 3 6.2-6.8" fill="none" stroke="#FF714F" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="62" y="31" fill="#F2F3ED" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-1">PostSteward</text>
  </g>

  <text x="72" y="205" fill="#FF9279" font-family="monospace" font-size="16" font-weight="700" letter-spacing="2">SOCIAL PUBLISHING INFRASTRUCTURE FOR AGENTS</text>
  <text x="72" y="278" fill="#F2F3ED" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="650" letter-spacing="-2.5">Let agents publish.</text>
  <text x="72" y="340" fill="#F2F3ED" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="650" letter-spacing="-2.5">Keep proof of what happened.</text>
  <text x="72" y="395" fill="#AEB3A9" font-family="Inter, Arial, sans-serif" font-size="22">Exact intent · bounded authority · durable evidence</text>

  <g transform="translate(72 464)">
