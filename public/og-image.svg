    <text x="382" y="49" fill="#F2F3ED" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650">identity · scope · duplicate fence</text>

    <path d="M670 37H714" stroke="#FF714F" stroke-width="2" />
    <path d="m708 31 7 6-7 6" fill="none" stroke="#FF714F" stroke-width="2" />

