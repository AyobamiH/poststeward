name: Production edge reconciliation
on:
  workflow_dispatch:
    inputs:
      origin:
        description: Exact custom production HTTPS origin, for example https://service.example.com
        required: true
        type: string
      zone:
        description: Exact active Cloudflare zone containing the hostname
        required: true
        type: string
      confirmation:
        description: Apply only the reviewed host-scoped WAF and auth rate-limit rules
        required: true
        type: choice
        options:
          - DO_NOT_APPLY
          - APPLY_POSTSTEWARD_PRODUCTION_EDGE
        default: DO_NOT_APPLY
  push:
    branches: [main]
    paths:
      - .github/workflows/production-edge-reconcile.yml
      - scripts/production-edge-authority-preflight.mjs
      - tests/production-edge-authority-preflight.test.mjs
      - scripts/production-edge-apply.mjs
      - tests/production-edge-apply.test.mjs
permissions:
  contents: read
concurrency:
  group: production-edge-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      github.repository == 'AyobamiH/poststeward' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'AyobamiH' &&
      (github.event_name == 'push' || inputs.confirmation == 'APPLY_POSTSTEWARD_PRODUCTION_EDGE')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      POSTSTEWARD_PRODUCTION_ORIGIN: ${{ github.event_name == 'workflow_dispatch' && inputs.origin || 'https://app.poststeward.com' }}
      CLOUDFLARE_ZONE_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.zone || 'poststeward.com' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Verify Cloudflare token, zone visibility and WAF read authority
        run: node scripts/production-edge-authority-preflight.mjs
      - name: Reconcile canonical Cloudflare zone controls
        env:
          POSTSTEWARD_APPLY_PRODUCTION_EDGE: ${{ github.event_name == 'push' && 'APPLY_POSTSTEWARD_PRODUCTION_EDGE' || inputs.confirmation }}
        run: node scripts/production-edge-apply.mjs
      - name: Independently read back production edge acceptance
        shell: bash
        run: |
          set -euo pipefail
          release="$(node --input-type=module -e 'const r=await fetch(process.env.POSTSTEWARD_PRODUCTION_ORIGIN+"/readiness.json",{redirect:"error",headers:{"Cache-Control":"no-cache"}});if(!r.ok)process.exit(1);const j=await r.json();if(j.environment!=="production"||!/^[a-f0-9]{40}$/.test(j.release||""))process.exit(1);process.stdout.write(j.release)')"
          POSTSTEWARD_EXPECTED_RELEASE="$release" npm run edge:check
