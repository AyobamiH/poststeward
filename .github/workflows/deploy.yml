name: Deploy reviewed configuration
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Configured GitHub environment
        type: choice
        options: [staging, production]
        default: staging
      run_pitr_diagnostic:
        description: Run staging-only prepare diagnostic without executing a restore
        type: boolean
        default: false
      advanced_rollout_request:
        description: Reviewed Advanced rollout override
        type: choice
        options: [environment, start_100bps, start_500bps, start_1000bps, stop]
        default: environment
  workflow_call:
    inputs:
      environment:
        description: Configured GitHub environment
        required: true
        type: string
      run_pitr_diagnostic:
        description: Run staging-only prepare diagnostic without executing a restore
        required: false
        type: boolean
        default: false
      advanced_rollout_request:
        description: Reviewed Advanced rollout override
        required: false
        type: string
        default: environment
    # Explicit repository-level fallbacks only; the selected environment takes precedence.
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      ENCRYPTION_KEY:
        required: false
      ENCRYPTION_KEY_NEXT:
        required: false
      OIDC_CLIENT_SECRET:
        required: false
      ALLOWED_OWNER_EMAILS:
        required: false
      POSTSTEWARD_GITHUB_APP_CLIENT_SECRET:
        required: false
      X_OAUTH_CLIENT_SECRET:
        required: false
      THREADS_OAUTH_CLIENT_SECRET:
        required: false
      LINKEDIN_OAUTH_CLIENT_SECRET:
        required: false
      STRIPE_SANDBOX_SECRET_KEY:
        required: false
      STRIPE_SANDBOX_WEBHOOK_SECRET:
        required: false
      OPERATIONAL_ALERT_WEBHOOK_URL:
        required: false
      OPERATIONAL_ALERT_WEBHOOK_TOKEN:
        required: false
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.repository == 'AyobamiH/poststeward' && (inputs.environment == 'staging' || (inputs.environment == 'production' && github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Require merged-PR provenance for automatic staging deployment
        if: inputs.environment == 'staging' && github.event_name == 'push'
        env:
          REQUIRE_MERGED_PR: "true"
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/assert-merge-provenance.mjs
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run verify
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.repository == 'AyobamiH/poststeward' && (inputs.environment == 'staging' || (inputs.environment == 'production' && github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.config.outputs.origin }}
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      ENCRYPTION_ROOT_WRITE: ${{ vars.ENCRYPTION_ROOT_WRITE }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_ID: ${{ vars.D1_ID }}
      WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
      OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
      GITHUB_APP_CLIENT_ID: ${{ vars.POSTSTEWARD_GITHUB_APP_CLIENT_ID }}
      GITHUB_APP_SLUG: ${{ vars.POSTSTEWARD_GITHUB_APP_SLUG }}
      X_OAUTH_CLIENT_ID: ${{ vars.X_OAUTH_CLIENT_ID }}
      THREADS_OAUTH_CLIENT_ID: ${{ vars.THREADS_OAUTH_CLIENT_ID }}
      LINKEDIN_OAUTH_CLIENT_ID: ${{ vars.LINKEDIN_OAUTH_CLIENT_ID }}
      LINKEDIN_MEMBER_READBACK: ${{ vars.LINKEDIN_MEMBER_READBACK }}
      STRIPE_SANDBOX_ENABLED: ${{ vars.STRIPE_SANDBOX_ENABLED }}
      STRIPE_SANDBOX_PRICE_ID: ${{ vars.STRIPE_SANDBOX_PRICE_ID }}
      ADVANCED_ENABLED: ${{ vars.ADVANCED_ENABLED }}
      ADVANCED_ROLLOUT_MODE: ${{ vars.ADVANCED_ROLLOUT_MODE }}
      ADVANCED_CANARY_BPS: ${{ vars.ADVANCED_CANARY_BPS }}
      ADVANCED_CANARY_SEED: ${{ vars.ADVANCED_CANARY_SEED }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      # No secret is available to dependency lifecycle scripts or tests.
      - run: npm ci --ignore-scripts
      - name: Resolve bounded Advanced rollout request
        env:
          POSTSTEWARD_ADVANCED_ROLLOUT_REQUEST: ${{ inputs.advanced_rollout_request }}
        run: node scripts/advanced-rollout-request.mjs
      - name: Configure isolated environment
        id: config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/configure-deploy.mjs
          node --input-type=module -e 'import fs from "node:fs"; const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, "origin="+c.vars.PUBLIC_ORIGIN+"\n");'
      - name: Inspect staging Google client rejection without signing in
        if: inputs.environment == 'staging'
        run: node scripts/owner-oidc-probe.mjs
        env:
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
      - name: Validate secrets and database; migrate and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ENCRYPTION_KEY_NEXT: ${{ secrets.ENCRYPTION_KEY_NEXT }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          ALLOWED_OWNER_EMAILS: ${{ secrets.ALLOWED_OWNER_EMAILS }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.POSTSTEWARD_GITHUB_APP_CLIENT_SECRET }}
          X_OAUTH_CLIENT_SECRET: ${{ secrets.X_OAUTH_CLIENT_SECRET }}
          THREADS_OAUTH_CLIENT_SECRET: ${{ secrets.THREADS_OAUTH_CLIENT_SECRET }}
          LINKEDIN_OAUTH_CLIENT_SECRET: ${{ secrets.LINKEDIN_OAUTH_CLIENT_SECRET }}
          STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          STRIPE_SANDBOX_WEBHOOK_SECRET: ${{ secrets.STRIPE_SANDBOX_WEBHOOK_SECRET }}
          OPERATIONAL_ALERT_WEBHOOK_URL: ${{ secrets.OPERATIONAL_ALERT_WEBHOOK_URL }}
          OPERATIONAL_ALERT_WEBHOOK_TOKEN: ${{ secrets.OPERATIONAL_ALERT_WEBHOOK_TOKEN }}
      - name: Verify deployed revision and access boundary
        run: node scripts/smoke.mjs
      - name: Verify owner acceptance surfaces without signing in or publishing
        run: node scripts/pilot-smoke.mjs
      - name: Verify unauthenticated browser rendering and blocked owner controls
        run: node scripts/pilot-browser-smoke.mjs
      - name: Verify non-destructive recovery and provider OAuth boundaries
        run: node scripts/recovery-smoke.mjs
      - name: Verify non-destructive account lifecycle boundary
        run: node scripts/lifecycle-smoke.mjs
      - name: Record verified Advanced canary boundary
        if: inputs.environment == 'staging'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/advanced-canary-run.mjs
      - name: Diagnose staging PITR prepare primitives without restoring
        if: inputs.environment == 'staging' && inputs.run_pitr_diagnostic == true
        run: node scripts/staging-pitr-prepare-diagnostic.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALLOWED_OWNER_EMAILS: ${{ secrets.ALLOWED_OWNER_EMAILS }}
      - name: Resolve fail-closed Advanced rollback after a failed canary start
        if: failure() && inputs.environment == 'staging' && startsWith(inputs.advanced_rollout_request, 'start_')
        env:
          POSTSTEWARD_ADVANCED_ROLLOUT_REQUEST: stop
        run: node scripts/advanced-rollout-request.mjs
      - name: Redeploy same reviewed release with Advanced stopped
        if: failure() && inputs.environment == 'staging' && startsWith(inputs.advanced_rollout_request, 'start_')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ENCRYPTION_KEY_NEXT: ${{ secrets.ENCRYPTION_KEY_NEXT }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          ALLOWED_OWNER_EMAILS: ${{ secrets.ALLOWED_OWNER_EMAILS }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.POSTSTEWARD_GITHUB_APP_CLIENT_SECRET }}
          X_OAUTH_CLIENT_SECRET: ${{ secrets.X_OAUTH_CLIENT_SECRET }}
          THREADS_OAUTH_CLIENT_SECRET: ${{ secrets.THREADS_OAUTH_CLIENT_SECRET }}
          LINKEDIN_OAUTH_CLIENT_SECRET: ${{ secrets.LINKEDIN_OAUTH_CLIENT_SECRET }}
          STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          STRIPE_SANDBOX_WEBHOOK_SECRET: ${{ secrets.STRIPE_SANDBOX_WEBHOOK_SECRET }}
          OPERATIONAL_ALERT_WEBHOOK_URL: ${{ secrets.OPERATIONAL_ALERT_WEBHOOK_URL }}
          OPERATIONAL_ALERT_WEBHOOK_TOKEN: ${{ secrets.OPERATIONAL_ALERT_WEBHOOK_TOKEN }}
        run: |
          node scripts/configure-deploy.mjs
          npm run deploy
          node scripts/advanced-canary-run.mjs
