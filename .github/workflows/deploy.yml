name: Deploy reviewed configuration
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment with configured Cloudflare variables
        type: choice
        options: [staging, production]
        default: staging
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      D1_ID: ${{ vars.D1_ID }}
      D1_NAME: ${{ vars.D1_NAME }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
      OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Configure environment
        run: node scripts/configure-deploy.mjs
      - run: npm run deploy:check
      - name: Apply additive identity migration
        run: npx wrangler d1 migrations apply "$D1_NAME" --remote
      - run: npm run deploy
      - name: Verify deployed revision
        run: node scripts/smoke.mjs
