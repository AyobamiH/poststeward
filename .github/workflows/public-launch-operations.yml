name: Public launch operator drill
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/public-launch-operations.yml
      - scripts/public-launch-ops-drill.mjs
      - tests/public-launch-ops-drill.test.mjs
permissions:
  contents: read
  issues: write
concurrency:
  group: public-launch-operator-drill
  cancel-in-progress: false
jobs:
  drill:
    if: github.repository == 'AyobamiH/poststeward' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      POSTSTEWARD_ORIGIN: https://app.poststeward.com
      POSTSTEWARD_REPOSITORY: AyobamiH/poststeward
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Bind drill to exact healthy production release
        shell: bash
        run: |
          set -euo pipefail
          release="$(node --input-type=module -e 'const r=await fetch(process.env.POSTSTEWARD_ORIGIN+"/readiness.json",{redirect:"error",headers:{"Cache-Control":"no-cache"}});if(!r.ok)process.exit(1);const j=await r.json();if(j.environment!=="production"||j.policy?.healthy!==true||j.access?.signupMode!=="restricted"||!/^[a-f0-9]{40}$/.test(j.release||""))process.exit(1);process.stdout.write(j.release)')"
          echo "POSTSTEWARD_EXPECTED_RELEASE=$release" >> "$GITHUB_ENV"
      - name: Exercise operator ownership without opening signup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/public-launch-ops-drill.mjs
