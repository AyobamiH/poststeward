name: Deploy requested staging revision
run-name: Deploy staging revision ${{ github.sha }}
# Deployment request: 2026-09-14-exact-recovery-acceptance
# Updating this file on main is an explicit staging deployment request.
# Deploy the exact reviewed revision containing provider capability negotiation and the
# exact-checkpoint disposable recovery/erasure acceptance harness from PR #69.
# Preserve the organised visual/product surfaces already deployed from PRs #63-#66.
# This deployment is non-destructive: it does not run the manual recovery workflow,
# restore or erase a workspace, initiate provider consent, publish, make a payment,
# or repeat accepted external evidence. The destructive exact-recovery acceptance remains
# a separate explicit owner-triggered manual workflow after this exact revision is healthy.
# The prepare-only timestamp diagnostic remains disabled. Root cutover remains on the
# already accepted next writer and the legacy root is intentionally retained.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-staging-request.yml
permissions:
  contents: read
  pull-requests: read
jobs:
  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'AyobamiH/poststeward' && github.actor == 'AyobamiH'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      run_pitr_diagnostic: false
    # Pass only explicitly named fallbacks, never every repository secret.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      ENCRYPTION_KEY_NEXT: ${{ secrets.ENCRYPTION_KEY_NEXT }}
      OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
      ALLOWED_OWNER_EMAILS: ${{ secrets.ALLOWED_OWNER_EMAILS }}
      POSTSTEWARD_GITHUB_APP_CLIENT_SECRET: ${{ secrets.POSTSTEWARD_GITHUB_APP_CLIENT_SECRET }}
      X_OAUTH_CLIENT_SECRET: ${{ secrets.X_OAUTH_CLIENT_SECRET }}
      THREADS_OAUTH_CLIENT_SECRET: ${{ secrets.THREADS_OAUTH_CLIENT_SECRET }}
      LINKEDIN_OAUTH_CLIENT_SECRET: ${{ secrets.LINKEDIN_OAUTH_CLIENT_SECRET }}
      STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
      STRIPE_SANDBOX_WEBHOOK_SECRET: ${{ secrets.STRIPE_SANDBOX_WEBHOOK_SECRET }}
