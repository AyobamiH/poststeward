name: Deploy requested staging revision
run-name: Deploy staging revision ${{ github.sha }}
# Deployment request: 2026-09-12-accepted-pilot-proof
# Updating this file on main is an explicit staging deployment request.
# Deploy PR #37: completed pilot evidence, offline receipt checker and incomplete Portal inventory guard.
# Sandbox billing remains disabled unless the reviewed staging variables and protected secrets are deliberately configured.
# Owner/provider consent, private GitHub grants, PITR, workspace erasure, Stripe settlement and root-secret replacement remain separate live acceptance gates.
# Hosted acceptance remains non-effectful: it must not publish social content, erase a workspace,
# invoke point-in-time restore, settle payment, rotate a protected root secret, or broaden owner authority.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-staging-request.yml
permissions:
  contents: read
  pull-requests: read
jobs:
  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'AyobamiH/poststeward' && github.actor == 'AyobamiH'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    # Pass only explicitly named fallbacks, never every repository secret.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
      ALLOWED_OWNER_EMAILS: ${{ secrets.ALLOWED_OWNER_EMAILS }}
      GITHUB_APP_CLIENT_SECRET: ${{ secrets.GITHUB_APP_CLIENT_SECRET }}
      X_OAUTH_CLIENT_SECRET: ${{ secrets.X_OAUTH_CLIENT_SECRET }}
      THREADS_OAUTH_CLIENT_SECRET: ${{ secrets.THREADS_OAUTH_CLIENT_SECRET }}
      LINKEDIN_OAUTH_CLIENT_SECRET: ${{ secrets.LINKEDIN_OAUTH_CLIENT_SECRET }}
      STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
      STRIPE_SANDBOX_WEBHOOK_SECRET: ${{ secrets.STRIPE_SANDBOX_WEBHOOK_SECRET }}
