name: Deploy requested staging revision
run-name: Deploy staging revision ${{ github.sha }}
# Deployment request: 2026-09-14-agent-native-visual-system
# Updating this file on main is an explicit staging deployment request.
# Deploy the exact reviewed revision that contains the merged PostSteward visual-system
# redesign from PR #63: semantic light/dark tokens, route-and-proof brand mark, and the
# redesigned public, workspace, controlled-acceptance, lifecycle, inventory and recovery
# surfaces. Existing operation bindings, provider authority, payment state and recovery
# behaviour are unchanged. This is an ordinary non-destructive staging deployment.
# It changes no provider authority, payment, recovery plan, signup policy, Advanced
# execution or external effect. The PITR diagnostic remains disabled and exact checkpoint
# recovery remains owner-only. Root cutover remains on the already accepted next writer;
# the legacy root is intentionally retained.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-staging-request.yml
permissions:
  contents: read
  pull-requests: read
jobs:
  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'AyobamiH/poststeward' && github.actor == 'AyobamiH'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      run_pitr_diagnostic: false
    # Pass only explicitly named fallbacks, never every repository secret.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      ENCRYPTION_KEY_NEXT: ${{ secrets.ENCRYPTION_KEY_NEXT }}
      OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
      ALLOWED_OWNER_EMAILS: ${{ secrets.ALLOWED_OWNER_EMAILS }}
      POSTSTEWARD_GITHUB_APP_CLIENT_SECRET: ${{ secrets.POSTSTEWARD_GITHUB_APP_CLIENT_SECRET }}
      X_OAUTH_CLIENT_SECRET: ${{ secrets.X_OAUTH_CLIENT_SECRET }}
      THREADS_OAUTH_CLIENT_SECRET: ${{ secrets.THREADS_OAUTH_CLIENT_SECRET }}
      LINKEDIN_OAUTH_CLIENT_SECRET: ${{ secrets.LINKEDIN_OAUTH_CLIENT_SECRET }}
      STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
      STRIPE_SANDBOX_WEBHOOK_SECRET: ${{ secrets.STRIPE_SANDBOX_WEBHOOK_SECRET }}
