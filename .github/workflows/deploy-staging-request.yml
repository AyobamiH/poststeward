name: Deploy requested staging revision
run-name: Deploy staging revision ${{ github.sha }}
# Deployment request: 2026-09-10-release-completion
# Updating this file through a merged PR is an explicit staging deployment request.
# The provenance job rejects a direct-push trigger even though repository-level
# branch protection remains a separate GitHub administration control.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-staging-request.yml
permissions:
  contents: read
  pull-requests: read
jobs:
  provenance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'AyobamiH/poststeward' && github.actor == 'AyobamiH'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Require exact merged-PR provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-deploy-provenance.mjs
  staging:
    needs: provenance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'AyobamiH/poststeward' && github.actor == 'AyobamiH'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    # Pass only explicitly named fallbacks, never every repository secret.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
      ALLOWED_OWNER_EMAILS: ${{ secrets.ALLOWED_OWNER_EMAILS }}
      X_OAUTH_CLIENT_SECRET: ${{ secrets.X_OAUTH_CLIENT_SECRET }}
      THREADS_OAUTH_CLIENT_SECRET: ${{ secrets.THREADS_OAUTH_CLIENT_SECRET }}
      LINKEDIN_OAUTH_CLIENT_SECRET: ${{ secrets.LINKEDIN_OAUTH_CLIENT_SECRET }}
