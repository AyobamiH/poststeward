name: Final recovery hardening
on:
  push:
    branches: [feat/recovery-ledger-ops-v2]
    paths: [.github/workflows/recovery-final-hardening.yml]
permissions:
  contents: write
jobs:
  harden:
    if: github.repository == 'AyobamiH/poststeward' && github.actor == 'AyobamiH'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Close the quarantine race and keep expired plans cancellable
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/effects.ts')
          s = p.read_text()
          old = '''    const inserted = await this.db\n      .prepare(\n        "INSERT INTO external_containers(workspace,fingerprint,delivery_id,status,created_at,updated_at) VALUES (?,?,?,'intent',?,?) ON CONFLICT(workspace,fingerprint) DO NOTHING",\n      )\n      .bind(this.workspace, delivery.fingerprint, delivery.id, now, now)\n      .run();\n    if (inserted.meta.changes !== 1) {\n      const prior = await this.existingContainer(delivery);'''
          new = '''    const inserted = await this.db\n      .prepare(\n        "INSERT INTO external_containers(workspace,fingerprint,delivery_id,status,created_at,updated_at) SELECT ?,?,?,'intent',?,? WHERE COALESCE((SELECT publishing_quarantined FROM workspace_controls WHERE workspace=?),0)=0 ON CONFLICT(workspace,fingerprint) DO NOTHING",\n      )\n      .bind(\n        this.workspace,\n        delivery.fingerprint,\n        delivery.id,\n        now,\n        now,\n        this.workspace,\n      )\n      .run();\n    if (inserted.meta.changes !== 1) {\n      const control = await workspaceQuarantined(this.db, this.workspace);\n      requireValue(\n        !control.quarantined,\n        "RECOVERY_QUARANTINED",\n        "Workspace entered recovery quarantine before the Threads container intent was acquired.",\n        409,\n      );\n      const prior = await this.existingContainer(delivery);'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''    const inserted = await this.db\n      .prepare(\n        "INSERT INTO external_effects(workspace,fingerprint,delivery_id,provider,text_digest,status,claim_id,created_at,updated_at) VALUES (?,?,?,?,?,'intent',?,?,?) ON CONFLICT(workspace,fingerprint) DO NOTHING",\n      )\n      .bind(\n        this.workspace,\n        delivery.fingerprint,\n        delivery.id,\n        delivery.provider,\n        delivery.digest,\n        delivery.claimId || null,\n        now,\n        now,\n      )\n      .run();\n    if (inserted.meta.changes !== 1) {\n      const prior = await this.existing(delivery);'''
          new = '''    const inserted = await this.db\n      .prepare(\n        "INSERT INTO external_effects(workspace,fingerprint,delivery_id,provider,text_digest,status,claim_id,created_at,updated_at) SELECT ?,?,?,?,?,'intent',?,?,? WHERE COALESCE((SELECT publishing_quarantined FROM workspace_controls WHERE workspace=?),0)=0 ON CONFLICT(workspace,fingerprint) DO NOTHING",\n      )\n      .bind(\n        this.workspace,\n        delivery.fingerprint,\n        delivery.id,\n        delivery.provider,\n        delivery.digest,\n        delivery.claimId || null,\n        now,\n        now,\n        this.workspace,\n      )\n      .run();\n    if (inserted.meta.changes !== 1) {\n      const control = await workspaceQuarantined(this.db, this.workspace);\n      requireValue(\n        !control.quarantined,\n        "RECOVERY_QUARANTINED",\n        "Workspace entered recovery quarantine before the publication intent was acquired.",\n        409,\n      );\n      const prior = await this.existing(delivery);'''
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('src/recovery.ts')
          s = p.read_text()
          old = '''    actor: string;\n    states: RecoveryState[];\n  },'''
          new = '''    actor: string;\n    states: RecoveryState[];\n    allowExpiredPrepared?: boolean;\n  },'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''  if (plan.state === "prepared")\n    requireValue(\n      plan.expires_at > now,'''
          new = '''  if (plan.state === "prepared" && !input.allowExpiredPrepared)\n    requireValue(\n      plan.expires_at > now,'''
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('src/worker.ts')
          s = p.read_text()
          old = '''          actor: auth.actor.id,\n          states: ["prepared"],\n        });\n        await assertRecoveryCanResume(env.IDENTITY, auth.actor.workspace);\n        const cancelled = await env.IDENTITY'''
          new = '''          actor: auth.actor.id,\n          states: ["prepared"],\n          allowExpiredPrepared: true,\n        });\n        await assertRecoveryCanResume(env.IDENTITY, auth.actor.workspace);\n        const cancelled = await env.IDENTITY'''
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/effects-recovery.test.ts')
          s = p.read_text()
          s += '''\n\ntest("an expired prepared recovery cannot execute but remains explicitly cancellable", async () => {\n  const { mf, db } = await runtime();\n  try {\n    const now = Date.UTC(2026, 8, 9, 22, 0, 0);\n    const prepared: any = await prepareRecoveryPlan(\n      db,\n      {\n        workspace: "workspace-expired",\n        actor: "owner",\n        targetTime: now - 60000,\n        targetBookmark: "0000007b-target-bookmark-expired",\n        preRestoreBookmark: "0000007c-current-bookmark-expired",\n        reason: "test expired cancellation",\n      },\n      now,\n    );\n    await assert.rejects(\n      requireRecoveryPlan(\n        db,\n        {\n          id: prepared.id,\n          digest: prepared.digest,\n          workspace: "workspace-expired",\n          actor: "owner",\n          states: ["prepared"],\n        },\n        now + 600001,\n      ),\n      { code: "RECOVERY_PLAN_EXPIRED" },\n    );\n    const cancellable = await requireRecoveryPlan(\n      db,\n      {\n        id: prepared.id,\n        digest: prepared.digest,\n        workspace: "workspace-expired",\n        actor: "owner",\n        states: ["prepared"],\n        allowExpiredPrepared: true,\n      },\n      now + 600001,\n    );\n    assert.equal(cancellable.id, prepared.id);\n  } finally {\n    await mf.dispose();\n  }\n});\n\ntest("quarantine and external-effect intent acquisition are atomic in D1", async () => {\n  const { mf, db } = await runtime();\n  try {\n    let publications = 0;\n    let containers = 0;\n    const wrapped = new EffectLedgerProviders(\n      provider({\n        publish: async () => { publications++; return { id: "forbidden" }; },\n        createContainer: async () => { containers++; return "forbidden-container"; },\n      }),\n      db,\n      "workspace-atomic",\n    );\n    await setWorkspaceQuarantine(db, "workspace-atomic", true, "atomic acquisition test");\n    await assert.rejects(wrapped.publish(delivery("pub-atomic", "q".repeat(64)), credential), { code: "RECOVERY_QUARANTINED" });\n    const threads = { ...delivery("container-atomic", "r".repeat(64)), provider: "threads" as const };\n    await assert.rejects(wrapped.createContainer(threads, credential), { code: "RECOVERY_QUARANTINED" });\n    assert.equal(publications, 0);\n    assert.equal(containers, 0);\n    const postRows = await db.prepare("SELECT count(*) AS n FROM external_effects WHERE workspace=?").bind("workspace-atomic").first<{ n: number }>();\n    const containerRows = await db.prepare("SELECT count(*) AS n FROM external_containers WHERE workspace=?").bind("workspace-atomic").first<{ n: number }>();\n    assert.equal(Number(postRows?.n || 0), 0);\n    assert.equal(Number(containerRows?.n || 0), 0);\n  } finally {\n    await mf.dispose();\n  }\n});\n'''
          p.write_text(s)

          p = Path('docs/recovery.md')
          s = p.read_text()
          needle = 'After the restored object starts, locally restored authority is invalidated before reconciliation completes: provider accounts are made inactive, OAuth refresh metadata is discarded, automation profiles are disabled, unclaimed schedules are drift-blocked, and restored entitlement/checkout/customer state is cleared.'
          repl = 'After the restored object starts, locally restored authority is invalidated before reconciliation completes: provider accounts are made inactive, their restored encrypted access-token ciphertext is replaced with a non-usable tombstone, OAuth refresh metadata is discarded, automation profiles are disabled, unclaimed schedules are drift-blocked, and restored entitlement/checkout/customer state is cleared.'
          assert needle in s
          s = s.replace(needle, repl, 1)
          s += '\n\nAdvanced billing remains deliberately fail-closed after a PITR restore until current Stripe provider-of-record evidence is reconciled again. Recovery never treats historical entitlement state as proof of current paid access.\n'
          p.write_text(s)
          PY
          git diff --check
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' 'docs/recovery.md' 'src/effects.ts' 'src/recovery.ts' 'src/worker.ts' 'tests/effects-recovery.test.ts' | sort)
          test "$actual" = "$expected"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      - run: npm run verify
      - name: Push only the tested final hardening as AyobamiH
        run: |
          git config user.name 'AyobamiH'
          git config user.email '47716486+AyobamiH@users.noreply.github.com'
          git add docs/recovery.md src/effects.ts src/recovery.ts src/worker.ts tests/effects-recovery.test.ts
          git commit -m 'Close recovery quarantine races and expired-plan deadlocks'
          git push origin HEAD:feat/recovery-ledger-ops-v2
