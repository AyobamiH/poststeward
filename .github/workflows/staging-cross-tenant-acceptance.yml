name: Staging hosted cross-tenant acceptance
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Run reversible tenant-isolation acceptance with ephemeral staging grants
        required: true
        type: choice
        options:
          - DO_NOT_RUN
          - RUN_CROSS_TENANT_ACCEPTANCE
        default: DO_NOT_RUN
  push:
    branches: [main]
    paths:
      - .github/workflows/staging-cross-tenant-acceptance.yml
      - scripts/staging-cross-tenant-fixture.mjs

permissions:
  contents: read

concurrency:
  group: staging-hosted-cross-tenant-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'AyobamiH/poststeward' &&
      github.actor == 'AyobamiH' &&
      (github.event_name == 'push' || inputs.confirmation == 'RUN_CROSS_TENANT_ACCEPTANCE')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_ID: ${{ vars.D1_ID }}
      POSTSTEWARD_ORIGIN: ${{ vars.APP_ORIGIN || 'https://poststeward-staging.woeinvests.workers.dev' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run verify
      - name: Prove reversible hosted workspace isolation with ephemeral grants
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/staging-cross-tenant-fixture.mjs
