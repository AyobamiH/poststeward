name: Staging hosted cross-tenant acceptance
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Run reversible tenant-isolation acceptance with two synthetic disposable staging workspaces
        required: true
        type: choice
        options:
          - DO_NOT_RUN
          - RUN_CROSS_TENANT_ACCEPTANCE
        default: DO_NOT_RUN

permissions:
  contents: read

concurrency:
  group: staging-hosted-cross-tenant-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'AyobamiH/poststeward' &&
      github.actor == 'AyobamiH' &&
      inputs.confirmation == 'RUN_CROSS_TENANT_ACCEPTANCE'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
    env:
      DEPLOY_ENV: staging
      ENCRYPTION_ROOT_WRITE: ${{ vars.ENCRYPTION_ROOT_WRITE }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_ID: ${{ vars.D1_ID }}
      WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
      OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
      GITHUB_APP_CLIENT_ID: ${{ vars.POSTSTEWARD_GITHUB_APP_CLIENT_ID }}
      GITHUB_APP_SLUG: ${{ vars.POSTSTEWARD_GITHUB_APP_SLUG }}
      X_OAUTH_CLIENT_ID: ${{ vars.X_OAUTH_CLIENT_ID }}
      THREADS_OAUTH_CLIENT_ID: ${{ vars.THREADS_OAUTH_CLIENT_ID }}
      LINKEDIN_OAUTH_CLIENT_ID: ${{ vars.LINKEDIN_OAUTH_CLIENT_ID }}
      LINKEDIN_MEMBER_READBACK: ${{ vars.LINKEDIN_MEMBER_READBACK }}
      STRIPE_SANDBOX_ENABLED: ${{ vars.STRIPE_SANDBOX_ENABLED }}
      STRIPE_SANDBOX_PRICE_ID: ${{ vars.STRIPE_SANDBOX_PRICE_ID }}
      ADVANCED_ENABLED: ${{ vars.ADVANCED_ENABLED }}
      ADVANCED_ROLLOUT_MODE: ${{ vars.ADVANCED_ROLLOUT_MODE }}
      ADVANCED_CANARY_BPS: ${{ vars.ADVANCED_CANARY_BPS }}
      ADVANCED_CANARY_SEED: ${{ vars.ADVANCED_CANARY_SEED }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run verify
      - name: Configure exact staging bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/configure-deploy.mjs
      - name: Create disposable grants, prove isolation, revoke and erase
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALLOWED_OWNER_EMAILS: ${{ secrets.ALLOWED_OWNER_EMAILS }}
        run: node scripts/staging-cross-tenant-self-contained.mjs
