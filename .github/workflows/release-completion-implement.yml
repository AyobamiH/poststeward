name: Release completion implementation
on:
  push:
    branches:
      - feat/release-completion-control-plane
    paths:
      - .github/workflows/release-completion-implement.yml
permissions:
  contents: write
jobs:
  implement:
    if: github.repository == 'AyobamiH/poststeward' && github.actor == 'AyobamiH'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Implement, verify and commit the release-completion slice
        run: bash scripts/release-completion-implement.sh
