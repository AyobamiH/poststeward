name: Inspect staging setup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/staging-setup.yml
      - scripts/inspect-staging.mjs
permissions:
  contents: read
concurrency:
  group: inspect-staging
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && github.repository == 'AyobamiH/poststeward'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Inspect saved settings and existing Cloudflare resources
        run: node scripts/inspect-staging.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_ID: ${{ vars.D1_ID }}
          WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
          OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          HAS_ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY != '' }}
          HAS_OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET != '' }}
          HAS_ALLOWED_OWNER_EMAILS: ${{ secrets.ALLOWED_OWNER_EMAILS != '' }}
