name: Wire recovery prepare fail-safe
on:
  push:
    branches: [feat/recovery-ledger-ops-v2]
    paths: [.github/workflows/recovery-prepare-failsafe-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.repository == 'AyobamiH/poststeward' && github.actor == 'AyobamiH'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Roll back quarantine only when preparation failed before any armed plan or unresolved write
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/worker.ts')
          s = p.read_text()
          old = '''        await setWorkspaceQuarantine(\n          env.IDENTITY,\n          auth.actor.workspace,\n          true,\n          input.reason,\n        );\n        const bookmarks = await internalValue(\n          await invoke(\n            env,\n            auth.actor,\n            "",\n            { targetTime },\n            "/recovery/bookmarks",\n          ),\n        );\n        const plan = await prepareRecoveryPlan(env.IDENTITY, {\n          workspace: auth.actor.workspace,\n          actor: auth.actor.id,\n          targetTime,\n          targetBookmark: bookmarks.targetBookmark,\n          preRestoreBookmark: bookmarks.preRestoreBookmark,\n          reason: input.reason,\n        });\n        return json({ plan, status: await recoveryStatus(env.IDENTITY, auth.actor.workspace) });'''
          new = '''        await setWorkspaceQuarantine(\n          env.IDENTITY,\n          auth.actor.workspace,\n          true,\n          input.reason,\n        );\n        try {\n          const bookmarks = await internalValue(\n            await invoke(\n              env,\n              auth.actor,\n              "",\n              { targetTime },\n              "/recovery/bookmarks",\n            ),\n          );\n          const plan = await prepareRecoveryPlan(env.IDENTITY, {\n            workspace: auth.actor.workspace,\n            actor: auth.actor.id,\n            targetTime,\n            targetBookmark: bookmarks.targetBookmark,\n            preRestoreBookmark: bookmarks.preRestoreBookmark,\n            reason: input.reason,\n          });\n          return json({\n            plan,\n            status: await recoveryStatus(env.IDENTITY, auth.actor.workspace),\n          });\n        } catch (error) {\n          // Preparation has not called the destructive restore primitive yet.\n          // Release quarantine only if no concurrent/previous recovery is now\n          // prepared or armed and no provider-write fence is unresolved.\n          try {\n            await assertRecoveryCanResume(env.IDENTITY, auth.actor.workspace);\n            const status = await recoveryStatus(env.IDENTITY, auth.actor.workspace);\n            if (!status.plan || !["prepared", "armed"].includes(status.plan.state))\n              await setWorkspaceQuarantine(\n                env.IDENTITY,\n                auth.actor.workspace,\n                false,\n                "Recovery preparation failed before restore was armed.",\n              );\n          } catch {\n            // Fail closed: keep quarantine if safety cannot be proven.\n          }\n          throw error;\n        }'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only)" = "src/worker.ts"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      - run: npm run verify
      - name: Push only the tested source change as AyobamiH
        run: |
          git config user.name 'AyobamiH'
          git config user.email '47716486+AyobamiH@users.noreply.github.com'
          git add src/worker.ts
          git commit -m 'Fail closed without stranding quarantine on recovery prepare failure'
          git push origin HEAD:feat/recovery-ledger-ops-v2
