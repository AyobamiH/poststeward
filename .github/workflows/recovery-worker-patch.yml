name: Wire restored-authority invalidation
on:
  push:
    branches: [feat/recovery-ledger-ops-v2]
    paths: [.github/workflows/recovery-worker-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.repository == 'AyobamiH/poststeward' && github.actor == 'AyobamiH'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Wire the already-reviewed recovery invalidation at the post-restore probe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/worker.ts')
          s = p.read_text()
          anchor = 'import { Pilot } from "./pilot.ts";\n'
          addition = 'import { invalidateRestoredAuthority } from "./recovery-local.ts";\n'
          assert anchor in s and addition not in s
          s = s.replace(anchor, anchor + addition, 1)
          old = '''        const storage = this.pitr();\n        return json({\n          workspacePresent: true,\n          currentBookmark: await storage.getCurrentBookmark!(),\n        });'''
          new = '''        const storage = this.pitr();\n        const invalidated = invalidateRestoredAuthority(this.store);\n        return json({\n          workspacePresent: true,\n          currentBookmark: await storage.getCurrentBookmark!(),\n          authorityInvalidated: {\n            accounts: invalidated.accounts.length,\n            profiles: invalidated.profiles.length,\n            deliveries: invalidated.deliveries.length,\n            billingReset: invalidated.billingReset,\n          },\n        });'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only)" = "src/worker.ts"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      - run: npm run verify
      - name: Push only the tested source change as AyobamiH
        run: |
          git config user.name 'AyobamiH'
          git config user.email '47716486+AyobamiH@users.noreply.github.com'
          git add src/worker.ts
          git commit -m 'Invalidate restored authority before recovery reconciliation'
          git push origin HEAD:feat/recovery-ledger-ops-v2
