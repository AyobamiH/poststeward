name: Staging Advanced SLO observation
run-name: Staging Advanced SLO observation — ${{ github.event.client_payload.slot || github.event_name }}
on:
  workflow_dispatch:
  repository_dispatch:
    types: [poststeward-monitor-slo]

permissions:
  contents: read

concurrency:
  group: staging-advanced-slo-observation
  cancel-in-progress: true

jobs:
  observe:
    if: github.repository == 'AyobamiH/poststeward' && github.ref == 'refs/heads/main'
    runs-on: poststeward-operations
    timeout-minutes: 10
    environment:
      name: staging
    env:
      DEPLOY_ENV: staging
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_ID: ${{ vars.D1_ID }}
      POSTSTEWARD_ORIGIN: https://poststeward-staging.woeinvests.workers.dev
      POSTSTEWARD_SLO_OUTPUT: /tmp/poststeward-advanced-slo-${{ github.run_id }}-${{ github.run_attempt }}.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Build privacy-safe hosted canary observation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POSTSTEWARD_SLO_OPTIONAL: "true"
        run: node scripts/advanced-slo-observe.mjs
      - name: Evaluate canary SLO and error budget
        shell: bash
        run: |
          if [[ ! -f "$POSTSTEWARD_SLO_OUTPUT" ]]; then
            echo "No Advanced canary run is available yet; observation is idle."
            exit 0
          fi
          set +e
          node scripts/slo-evaluate.mjs "$POSTSTEWARD_SLO_OUTPUT"
          status=$?
          set -e
          if [[ $status -eq 1 ]]; then
            exit 1
          fi
          if [[ $status -eq 2 ]]; then
            echo "Advanced canary evidence is valid but not promotion-ready yet."
            exit 0
          fi
          if [[ $status -ne 0 ]]; then
            echo "Unexpected SLO evaluator exit status: $status" >&2
            exit 1
          fi
      - name: Remove run-scoped observation file
        if: always()
        shell: bash
        run: rm -f -- "$POSTSTEWARD_SLO_OUTPUT"
