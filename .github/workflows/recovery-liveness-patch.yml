name: Finalise bounded recovery liveness
on:
  push:
    branches: [feat/recovery-ledger-ops-v2]
    paths: [.github/workflows/recovery-liveness-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.repository == 'AyobamiH/poststeward' && github.actor == 'AyobamiH'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Apply the destructive-boundary and liveness corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/worker.ts')
          s = p.read_text()
          old = '''        await requireRecoveryPlan(env.IDENTITY, {\n          id: input.id,\n          digest: input.digest,\n          workspace: auth.actor.workspace,\n          actor: auth.actor.id,\n          states: ["prepared"],\n        });\n        let returned = false;'''
          new = '''        await requireRecoveryPlan(env.IDENTITY, {\n          id: input.id,\n          digest: input.digest,\n          workspace: auth.actor.workspace,\n          actor: auth.actor.id,\n          states: ["prepared"],\n        });\n        // A provider write may have crossed its D1 fence just before quarantine.\n        // Never arm PITR while that bounded write window can still be live.\n        await assertRecoveryCanResume(env.IDENTITY, auth.actor.workspace);\n        let returned = false;'''
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/effects-recovery.test.ts')
          s = p.read_text()
          start = s.index('test("recovery resume refuses unresolved publication or container effects"')
          replacement = '''test("fresh publication intents block recovery until their bounded write window settles", async () => {\n  const { mf, db } = await runtime();\n  try {\n    const now = Date.UTC(2026, 8, 9, 22, 0, 0);\n    await db\n      .prepare(\n        "INSERT INTO external_effects(workspace,fingerprint,delivery_id,provider,text_digest,status,created_at,updated_at) VALUES (?,?,?,?,?,'intent',?,?)",\n      )\n      .bind("workspace-a", "x".repeat(64), "delivery", "x", "d".repeat(64), now, now)\n      .run();\n    await assert.rejects(assertRecoveryCanResume(db, "workspace-a", now), {\n      code: "RECOVERY_EFFECTS_IN_FLIGHT",\n    });\n    const settled = await assertRecoveryCanResume(db, "workspace-a", now + 120001);\n    assert.equal(settled.intent, 0);\n    assert.equal(settled.uncertain, 1);\n  } finally {\n    await mf.dispose();\n  }\n});\n\ntest("ambiguous publication evidence stays individually fenced without wedging unrelated recovery", async () => {\n  const { mf, db } = await runtime();\n  try {\n    const now = Date.UTC(2026, 8, 9, 22, 0, 0);\n    await db\n      .prepare(\n        "INSERT INTO external_effects(workspace,fingerprint,delivery_id,provider,text_digest,status,created_at,updated_at) VALUES (?,?,?,?,?,'uncertain',?,?)",\n      )\n      .bind("workspace-a", "u".repeat(64), "delivery", "x", "d".repeat(64), now, now)\n      .run();\n    const counts = await assertRecoveryCanResume(db, "workspace-a", now);\n    assert.equal(counts.uncertain, 1);\n    assert.equal(counts.intent, 0);\n  } finally {\n    await mf.dispose();\n  }\n});\n'''
          p.write_text(s[:start] + replacement)

          p = Path('tests/recovery-container-resume.test.ts')
          p.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport { assertRecoveryCanResume } from "../src/recovery.ts";\nimport { runtime } from "./runtime-fixture.ts";\n\ntest("fresh Threads container intent blocks recovery, then becomes permanently fenced uncertainty after the settlement window", async () => {\n  const { mf, db } = await runtime();\n  try {\n    const now = Date.UTC(2026, 8, 9, 22, 0, 0);\n    await db\n      .prepare(\n        "INSERT INTO external_containers(workspace,fingerprint,delivery_id,status,created_at,updated_at) VALUES (?,?,?,'intent',?,?)",\n      )\n      .bind(\n        "workspace-a",\n        "z".repeat(64),\n        "threads-delivery",\n        now,\n        now,\n      )\n      .run();\n    await assert.rejects(assertRecoveryCanResume(db, "workspace-a", now), {\n      code: "RECOVERY_EFFECTS_IN_FLIGHT",\n    });\n    const settled = await assertRecoveryCanResume(db, "workspace-a", now + 120001);\n    assert.equal(settled.containerIntent, 0);\n    assert.equal(settled.containerUncertain, 1);\n  } finally {\n    await mf.dispose();\n  }\n});\n''')

          p = Path('docs/recovery.md')
          s = p.read_text()
          old = '5. Inspect receipts, external-effect counts, accounts, automation and recovered business state. Unresolved publication or Threads-container write fences (`intent`/`uncertain`) block resume.'
          new = '5. Inspect receipts, external-effect counts, accounts, automation and recovered business state. A fresh `intent` fence blocks PITR execution/resume for two minutes because the provider call may still be live. After that bounded window it becomes `uncertain`: the exact fingerprint stays permanently fenced against replay, but unrelated recovered work is not wedged by an old ambiguous effect.'
          assert old in s
          s = s.replace(old, new, 1)
          old = 'D1 unavailability fails closed before provider writes and recovery state changes. Provider-side network uncertainty is preserved as an `uncertain` external-effect fence and requires reconciliation rather than retry.'
          new = 'D1 unavailability fails closed before provider writes and recovery state changes. Provider-side network uncertainty is preserved as an `uncertain` external-effect fence. That fingerprint can never be blindly retried, while unrelated work can resume after restored authority has been invalidated and no fresh external write remains in flight.'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' 'docs/recovery.md' 'src/worker.ts' 'tests/effects-recovery.test.ts' 'tests/recovery-container-resume.test.ts' | sort)
          test "$actual" = "$expected"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      - run: npm run verify
      - name: Push only the tested correction as AyobamiH
        run: |
          git config user.name 'AyobamiH'
          git config user.email '47716486+AyobamiH@users.noreply.github.com'
          git add docs/recovery.md src/worker.ts tests/effects-recovery.test.ts tests/recovery-container-resume.test.ts
          git commit -m 'Bound recovery around in-flight effects without global ambiguity deadlock'
          git push origin HEAD:feat/recovery-ledger-ops-v2
