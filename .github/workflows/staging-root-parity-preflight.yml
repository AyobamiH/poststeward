name: Restricted staging root parity (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: poststeward-staging-root-parity-readonly
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'AyobamiH/poststeward' && github.ref == 'refs/heads/main' && github.actor == 'AyobamiH'
    runs-on: poststeward-release
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Verify exact active Worker against protected staging key roots without effects
        run: node scripts/staging-root-parity-preflight.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STAGING_ROOT_WRITE: ${{ vars.ENCRYPTION_ROOT_WRITE }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ENCRYPTION_KEY_NEXT: ${{ secrets.ENCRYPTION_KEY_NEXT }}
