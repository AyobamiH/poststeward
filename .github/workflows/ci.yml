name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Installable client syntax
        run: |
          bash -n public/install.sh
          python3 -m py_compile public/poststeward.py
          python3 public/poststeward.py --version
          python3 public/poststeward.py help --json > /tmp/poststeward-client-help.json
          python3 - <<'PY'
          import json
          value=json.load(open("/tmp/poststeward-client-help.json"))
          assert value["schema_version"] == 1
          assert value["product"] == "poststeward"
          assert "onboard" in value["commands"]
          assert "providers" in value["commands"]
          assert "invoke" in value["commands"]
          PY
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit
        run: npm audit --audit-level=high
      - run: npm run verify
