name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      self_hosted_verify:
        description: Run trusted verifier and Python matrix jobs on isolated PostSteward runners
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: >-
      ${{ github.repository == 'AyobamiH/poststeward' &&
          ((github.event_name == 'workflow_dispatch' && inputs.self_hosted_verify &&
             github.actor == 'AyobamiH' && github.ref_type == 'branch') ||
           (github.event_name == 'push' && github.ref_type == 'branch' &&
             github.actor == 'AyobamiH') ||
           (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository &&
             github.event.pull_request.user.login == 'AyobamiH'))
          && 'poststeward-verification' || 'ubuntu-latest' }}
    # Includes dependency download and the full Worker suite on the bounded runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          # npm ci installs pinned dependencies; avoid a cache-save hang on isolated runners.
      - run: npm ci
      - name: Installable runtime syntax
        run: |
          bash -n public/install.sh
          python3 -m py_compile \
            runtime/src/ocpf_post/product_entry.py \
            runtime/src/ocpf_post/product_runtime.py \
            runtime/src/ocpf_post/poststeward_cloud.py \
            runtime/src/ocpf_post/poststeward_onboarding.py \
            runtime/src/ocpf_post/poststeward_product.py \
            runtime/src/ocpf_post/providers/poststeward_relay.py
          POSTSTEWARD_RUNTIME_ROOT="$PWD/runtime" \
          POSTSTEWARD_RUNTIME_CONFIG_DIR="$RUNNER_TEMP/runtime-config" \
          POSTSTEWARD_RUNTIME_STATE_DIR="$RUNNER_TEMP/runtime-state" \
          POSTSTEWARD_SETUP_STATE_DIR="$RUNNER_TEMP/runtime-setup" \
          POSTSTEWARD_RELEASES_DIR="$RUNNER_TEMP/runtime-releases" \
            ./runtime/poststeward --version
      - name: Monitor clock recovery regressions
        run: python3 -m unittest discover -s ops/monitor-clock -p 'test_*.py'
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit
        run: npm audit --audit-level=high
      - name: Embedded runtime product identity
        run: |
          POSTSTEWARD_RUNTIME_ROOT="$PWD/runtime" \
          POSTSTEWARD_RUNTIME_CONFIG_DIR="$RUNNER_TEMP/poststeward-config" \
          POSTSTEWARD_RUNTIME_STATE_DIR="$RUNNER_TEMP/poststeward-state" \
          POSTSTEWARD_SETUP_STATE_DIR="$RUNNER_TEMP/poststeward-setup" \
          POSTSTEWARD_RELEASES_DIR="$RUNNER_TEMP/poststeward-releases" \
            ./runtime/poststeward --version
          POSTSTEWARD_RUNTIME_ROOT="$PWD/runtime" \
          POSTSTEWARD_RUNTIME_CONFIG_DIR="$RUNNER_TEMP/poststeward-config" \
          POSTSTEWARD_RUNTIME_STATE_DIR="$RUNNER_TEMP/poststeward-state" \
          POSTSTEWARD_SETUP_STATE_DIR="$RUNNER_TEMP/poststeward-setup" \
          POSTSTEWARD_RELEASES_DIR="$RUNNER_TEMP/poststeward-releases" \
            ./runtime/poststeward help --json > /tmp/poststeward-runtime-help.json
          python3 - <<'PY'
          import json
          value=json.load(open("/tmp/poststeward-runtime-help.json"))
          assert value["schema_version"] == 1
          assert value["commands"]
          PY
      - name: Set up Python for embedded runtime verification
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Embedded runtime authority and recovery regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m venv "$RUNNER_TEMP/poststeward-runtime-verify"
          "$RUNNER_TEMP/poststeward-runtime-verify/bin/python" -m pip install -e "./runtime[dev]" "setuptools>=68" wheel
          cd runtime
          "$RUNNER_TEMP/poststeward-runtime-verify/bin/python" -m unittest discover -s tests -p 'test_*.py'
      - run: npm run verify
  runtime:
    runs-on: >-
      ${{ github.repository == 'AyobamiH/poststeward' &&
          ((github.event_name == 'workflow_dispatch' && inputs.self_hosted_verify &&
             github.actor == 'AyobamiH' && github.ref_type == 'branch') ||
           (github.event_name == 'push' && github.ref_type == 'branch' &&
             github.actor == 'AyobamiH') ||
           (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository &&
             github.event.pull_request.user.login == 'AyobamiH'))
          && 'poststeward-verification' || 'ubuntu-latest' }}
    # Reuse the same explicitly trusted, owner-scoped JIT lane as verify.
    # Untrusted forks continue using hosted jobs; no privileged runner fallback.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install embedded runtime into isolated Python environment
        run: |
          # Do not mutate the uv-managed Python 3.10 toolcache (PEP 668).
          python -m venv "$RUNNER_TEMP/poststeward-runtime-matrix"
          "$RUNNER_TEMP/poststeward-runtime-matrix/bin/python" -m pip install -e "./runtime[dev]" "setuptools>=68" wheel
          echo "$RUNNER_TEMP/poststeward-runtime-matrix/bin" >> "$GITHUB_PATH"
      - name: Embedded runtime regression suite
        run: |
          cd runtime
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Canonical PostSteward runtime discovery
        env:
          POSTSTEWARD_RUNTIME_ROOT: ${{ github.workspace }}/runtime
          POSTSTEWARD_RUNTIME_CONFIG_DIR: ${{ runner.temp }}/poststeward-config
          POSTSTEWARD_RUNTIME_STATE_DIR: ${{ runner.temp }}/poststeward-state
          POSTSTEWARD_SETUP_STATE_DIR: ${{ runner.temp }}/poststeward-setup
          POSTSTEWARD_RELEASES_DIR: ${{ runner.temp }}/poststeward-releases
        run: |
          ./runtime/poststeward --version
          ./runtime/poststeward help --json > /tmp/poststeward-runtime-help.json
          python - <<'PY'
          import json
          value=json.load(open("/tmp/poststeward-runtime-help.json"))
          assert value["schema_version"] == 1
          assert value["commands"]
          PY
