name: Temporary Dependency Lock Refresh

on:
  push:
    branches:
      - fix/public-agent-discovery
    paths:
      - "package.json"
      - ".github/workflows/temp-lock-refresh.yml"

permissions:
  contents: write

concurrency:
  group: poststeward-lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-agent-discovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh exact lock and safe transitive fixes
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
      - name: Commit refreshed lock
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "AyobamiH"
          git config user.email "47716486+AyobamiH@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh dependency lock after MCP SDK security update"
          git push origin HEAD:fix/public-agent-discovery
