name: Finalise dependency manifests
on:
  push:
    branches: [chore/dependency-audit-closure]
    paths:
      - .github/workflows/dependency-lock-preview.yml
permissions:
  contents: write
jobs:
  finalise:
    if: github.repository == 'AyobamiH/poststeward' && github.actor == 'AyobamiH' && github.ref == 'refs/heads/chore/dependency-audit-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build and prove the exact manifest remediation
        run: |
          set -euo pipefail
          npm pkg set overrides.sharp=0.35.4
          npm install --package-lock-only --ignore-scripts
          rm -f scripts/audit-summary.mjs
          expected=$(printf '%s\n' 'package-lock.json' 'package.json' 'scripts/audit-summary.mjs' | sort)
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected"
          git diff --check
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
          npm run verify
          echo "POSTSTEWARD_FINAL_MANIFEST_DIFF_SHA256=$(git diff --binary | sha256sum | cut -d' ' -f1)"
      - name: Commit only the tested non-workflow files as AyobamiH
        run: |
          set -euo pipefail
          git config user.name 'AyobamiH'
          git config user.email '47716486+AyobamiH@users.noreply.github.com'
          git add package.json package-lock.json scripts/audit-summary.mjs
          git commit -m 'Close full dependency audit findings with patched sharp override'
          git push origin HEAD:chore/dependency-audit-closure
