name: Dependency lock remediation preview
on:
  push:
    branches: [chore/dependency-audit-closure]
    paths:
      - .github/workflows/dependency-lock-preview.yml
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Prove whether npm ci can apply a package-only sharp override against the existing lockfile
        run: |
          npm pkg set overrides.sharp=0.35.4
          cp package-lock.json package-lock.before.json
          npm ci --ignore-scripts
          cmp package-lock.json package-lock.before.json
          npm audit --audit-level=high
          npm run verify
