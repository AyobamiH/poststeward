version: 2.1
jobs:
  native-macos-local-lifecycle:
    macos:
      xcode: "26.4.1"
    resource_class: m4pro.medium
    working_directory: ~/poststeward
    environment:
      CI: "true"
    steps:
      - checkout
      - run:
          name: Attest genuine Apple Silicon and exact source
          command: |
            set -euo pipefail
            test "$(uname -s)" = Darwin
            test "$(uname -m)" = arm64
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            sw_vers
      - run:
          name: Exercise isolated refill crash and recovery on Darwin
          command: |
            set -euo pipefail
            export PYTHONPATH="$PWD/runtime/src"
            python3 -m unittest discover -s runtime/tests -p test_refill_crash_process.py -v
      - run:
          name: Exercise real isolated launchd bootstrap and disarm without provider effects
          command: |
            set -euo pipefail
            export PYTHONPATH="$PWD/runtime/src"
            python3 -m unittest discover -s runtime/tests -p test_native_launchd_cycle.py -v
      - run:
          name: Install, update, rollback and preserve inactive state on real macOS
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            ROOT="$(mktemp -d)"
            trap 'rm -rf "$ROOT"' EXIT
            mkdir -p "$ROOT/bin"
            export POSTSTEWARD_INSTALL_PREFIX="$ROOT/install"
            export POSTSTEWARD_BIN_DIR="$ROOT/bin"
            bash public/install.sh --version 9fd549bea3c094abe38a75b331a3c60967fdad7b --no-onboard
            bash public/install.sh --version "$CIRCLE_SHA1" --no-onboard
            "$ROOT/bin/poststeward" status --json > "$ROOT/status.json"
            python3 - "$ROOT/status.json" "$CIRCLE_SHA1" <<'PYMAC'
            import json,sys
            d=json.load(open(sys.argv[1]));assert d['release_sha']==sys.argv[2]
            assert d['automation_authority']['status']=='inactive'
            assert all(not t['active'] and not t['enabled'] for t in d['services']['timers'])
            PYMAC
            "$ROOT/bin/poststeward" rollback --json > "$ROOT/rollback-preview.json"
            python3 - "$ROOT/rollback-preview.json" "$ROOT/review.txt" <<'PYMAC'
            import json,sys
            d=json.load(open(sys.argv[1]));assert d['status']=='preview' and d['retain_data']
            open(sys.argv[2],'w').write(d['review_sha256'])
            PYMAC
            "$ROOT/bin/poststeward" rollback --apply --expected-sha256 "$(cat "$ROOT/review.txt")" --json > "$ROOT/rollback.json"
            bash public/install.sh --version "$CIRCLE_SHA1" --no-onboard
            "$ROOT/bin/poststeward" status --json > "$ROOT/final-status.json"
            python3 - "$ROOT/final-status.json" "$CIRCLE_SHA1" <<'PYMAC'
            import json,sys
            d=json.load(open(sys.argv[1]));assert d['release_sha']==sys.argv[2]
            assert d['automation_authority']['status']=='inactive'
            PYMAC
      - run:
          name: Verify native launchd and installer fail-closed contracts
          command: |
            set -euo pipefail
            export PYTHONPATH="$PWD/runtime/src"
            python3 -m py_compile runtime/src/ocpf_post/launchd_services.py runtime/src/ocpf_post/host_platform.py
            bash -n public/install.sh
            python3 - <<'PYMAC'
            import sys
            from ocpf_post.host_platform import host
            assert sys.platform == 'darwin'
            assert host()['service_manager'] == 'launchd'
            print('Darwin runtime import and launchd service source verified')
            PYMAC
workflows:
  native-macos-customer-acceptance:
    jobs:
      - native-macos-local-lifecycle:
          filters:
            branches:
              only:
                - test/native-macos-and-refill-acceptance
                - agent/native-customer-lifecycle-20261112
